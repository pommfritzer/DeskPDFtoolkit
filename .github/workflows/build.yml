name: Windows build
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m venv .venv
      - run: .venv/Scripts/python -m pip install -e ".[dev]"
      - run: ./scripts/build.ps1
        shell: pwsh
      - uses: actions/upload-artifact@v4
        with:
          name: PDFtoolkit26-Windows-x64
          path: releases/*.exe
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: windows
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: PDFtoolkit26-Windows-x64
          path: releases
      - name: Publish preview installer
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          Get-FileHash releases/PDFtoolkit26-0.3.0-Setup.exe -Algorithm SHA256 | ForEach-Object { $_.Hash.ToLower() + '  PDFtoolkit26-0.3.0-Setup.exe' } | Set-Content -Encoding ascii releases/SHA256SUMS.txt
          gh release view $env:GITHUB_REF_NAME
          if ($LASTEXITCODE) {
            gh release create $env:GITHUB_REF_NAME --draft --prerelease --title "PDFtoolkit26 $env:GITHUB_REF_NAME — Windows preview" --notes "Native Windows PDF workbench. See the README for supported tools, optional dependencies, and limitations. This preview installer is unsigned."
            if ($LASTEXITCODE) { throw 'Could not create release.' }
          }
          gh release upload $env:GITHUB_REF_NAME releases/PDFtoolkit26-0.3.0-Setup.exe releases/SHA256SUMS.txt --clobber
          if ($LASTEXITCODE) { throw 'Could not upload installer.' }
          gh release edit $env:GITHUB_REF_NAME --draft=false --prerelease
          if ($LASTEXITCODE) { throw 'Could not publish release.' }
