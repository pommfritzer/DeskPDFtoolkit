name: Desktop builds
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m venv .venv
      - run: .venv/Scripts/python -m pip install -e ".[dev]"
      - run: ./scripts/build.ps1
        shell: pwsh
      - uses: actions/upload-artifact@v4
        with:
          name: PDFtoolkit26-Windows-x64
          path: releases/*.exe
  unix:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
      PDFTOOLKIT26_TEST_TESSERACT: tesseract
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libxcb-xinerama0 libxcb-xinput0 libxcb-render-util0 xvfb xauth desktop-file-utils fonts-dejavu-core tesseract-ocr
      - if: runner.os == 'macOS'
        run: command -v tesseract || brew install tesseract
      - run: python -m pip install ".[dev]"
      - run: bash scripts/build-unix.sh
        env:
          PYTHON: python
      - if: runner.os == 'Linux'
        run: QT_QPA_PLATFORM=xcb xvfb-run -a python scripts/check_bundle.py
      - name: Check Linux install and uninstall
        if: runner.os == 'Linux'
        run: |
          export HOME="$RUNNER_TEMP/pdftoolkit26-home"
          export XDG_DATA_HOME="$RUNNER_TEMP/pdftoolkit26-data"
          mkdir -p "$HOME"
          sh dist/PDFtoolkit26/install.sh
          PDFTOOLKIT26_CHECK_EXECUTABLE="$XDG_DATA_HOME/pdftoolkit26/PDFtoolkit26" QT_QPA_PLATFORM=xcb xvfb-run -a python scripts/check_bundle.py
          sh "$XDG_DATA_HOME/pdftoolkit26/uninstall.sh"
          test ! -e "$XDG_DATA_HOME/pdftoolkit26"
      - name: Check installed package outside the checkout
        run: |
          cd "$RUNNER_TEMP"
          python -m deskpdf.app --help
      - uses: actions/upload-artifact@v4
        with:
          name: PDFtoolkit26-Unix-${{ matrix.os }}
          path: |
            releases/*.tar.gz
            releases/*.zip
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, unix]
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: PDFtoolkit26-Windows-x64
          path: releases
      - uses: actions/download-artifact@v4
        with:
          pattern: PDFtoolkit26-Unix-*
          path: releases
          merge-multiple: true
      - name: Publish preview installer
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $assets = @(Get-ChildItem releases -File | Where-Object { $_.Extension -in '.exe', '.gz', '.zip' })
          $assets | Get-FileHash -Algorithm SHA256 | ForEach-Object { $_.Hash.ToLower() + '  ' + (Split-Path $_.Path -Leaf) } | Set-Content -Encoding ascii releases/SHA256SUMS.txt
          gh release view $env:GITHUB_REF_NAME
          if ($LASTEXITCODE) {
            gh release create $env:GITHUB_REF_NAME --draft --prerelease --title "PDFtoolkit26 $env:GITHUB_REF_NAME — desktop preview" --notes "PDF workbench for Windows, Linux and macOS. See the README for supported tools, optional dependencies, and limitations. These preview builds are not signed by a public certificate."
            if ($LASTEXITCODE) { throw 'Could not create release.' }
          }
          $assetPaths = @($assets | ForEach-Object { $_.FullName }) + @('releases/SHA256SUMS.txt')
          gh release upload $env:GITHUB_REF_NAME @assetPaths --clobber
          if ($LASTEXITCODE) { throw 'Could not upload installer.' }
          gh release edit $env:GITHUB_REF_NAME --draft=false --prerelease
          if ($LASTEXITCODE) { throw 'Could not publish release.' }
